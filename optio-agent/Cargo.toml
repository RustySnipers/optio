[package]
name = "optio-agent"
version = "0.1.0"
edition = "2021"
description = "Lightweight agent for the Optio Enterprise IT Management Platform"

[[bin]]
name = "optio-agent"
path = "src/main.rs"

[dependencies]
optio-core = { path = "../optio-core" }
tokio = { workspace = true }
tonic = { workspace = true }

# System information gathering
sysinfo = "0.32"
hostname = "0.4"

# Async utilities
futures = "0.3"
tokio-stream = "0.1"

# Serialization
serde = { workspace = true }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID for machine ID
uuid = { version = "1", features = ["v4", "v5"] }

# Base64 encoding for scripts
base64 = "0.22"

# Configuration file parsing
toml = "0.8"

# Date/time for panic logs
chrono = { version = "0.4", features = ["serde"] }

# PTY support for interactive terminal sessions
portable-pty = "0.8"

# Prost for protobuf types
prost = { workspace = true }

# Command line argument parsing
clap = { version = "4", features = ["derive"] }

# HTTP client for updates
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# Self-replacement for binary updates
self-replace = "1.4"

# SHA256 verification
sha2 = "0.10"
hex = "0.4"

# Semver for version comparison
semver = "1"

# Windows Service support (Windows only)
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
tempfile = "3"
