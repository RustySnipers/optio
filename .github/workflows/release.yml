name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # Build Core - Run Tests
  # ==========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Rust tests
        run: cargo test --workspace --all-features

      - name: Run Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  # ==========================================================================
  # Build Agent - Cross-platform binary builds
  # ==========================================================================
  build-agent:
    name: Build Agent (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: optio-agent.exe
            asset_name: optio-agent-windows-x86_64.exe

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: optio-agent
            asset_name: optio-agent-linux-x86_64

          # Linux aarch64 (ARM64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: optio-agent
            asset_name: optio-agent-linux-aarch64

          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: optio-agent
            asset_name: optio-agent-macos-x86_64

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: optio-agent
            asset_name: optio-agent-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Install cross-compilation tools for Linux ARM64
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Agent
        run: cargo build --release --package optio-agent --target ${{ matrix.target }}
        env:
          # For cross-compilation to Linux ARM64
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}

      # ==========================================================================
      # CODE SIGNING (Windows)
      # Secrets needed:
      #   - WINDOWS_SIGNING_CERT_BASE64: Base64 encoded .pfx certificate
      #   - WINDOWS_SIGNING_CERT_PASSWORD: Certificate password
      # ==========================================================================
      - name: Sign Windows Binary
        if: matrix.os == 'windows-latest' && env.SIGNING_CERT_AVAILABLE == 'true'
        env:
          SIGNING_CERT_AVAILABLE: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 != '' }}
        shell: powershell
        run: |
          Write-Host "Signing Windows binary with code signing certificate..."

          # Decode certificate from base64
          $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}")
          [IO.File]::WriteAllBytes("cert.pfx", $certBytes)

          # Find signtool.exe (available on windows-latest runners)
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
                      Where-Object { $_.FullName -match "x64" } |
                      Sort-Object LastWriteTime -Descending |
                      Select-Object -First 1

          if (-not $signtool) {
            Write-Error "signtool.exe not found"
            exit 1
          }

          Write-Host "Using signtool: $($signtool.FullName)"

          # Sign the binary with SHA256 and timestamp
          & $signtool.FullName sign `
              /f cert.pfx `
              /p "${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}" `
              /tr http://timestamp.digicert.com `
              /td sha256 `
              /fd sha256 `
              /v `
              artifacts/${{ matrix.asset_name }}

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Code signing failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          # Clean up certificate
          Remove-Item cert.pfx -Force
          Write-Host "Binary signed successfully!"

      - name: Skip Windows Signing (No Certificate)
        if: matrix.os == 'windows-latest' && env.SIGNING_CERT_AVAILABLE != 'true'
        env:
          SIGNING_CERT_AVAILABLE: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 != '' }}
        shell: powershell
        run: |
          Write-Host "NOTE: Windows code signing skipped - WINDOWS_SIGNING_CERT_BASE64 secret not configured."
          Write-Host "To enable signing, add the following secrets:"
          Write-Host "  - WINDOWS_SIGNING_CERT_BASE64: Base64 encoded .pfx certificate"
          Write-Host "  - WINDOWS_SIGNING_CERT_PASSWORD: Certificate password"

      # ==========================================================================
      # CODE SIGNING (macOS)
      # Secrets needed:
      #   - APPLE_SIGNING_CERT_BASE64: Base64 encoded .p12 certificate
      #   - APPLE_SIGNING_CERT_PASSWORD: Certificate password
      #   - APPLE_TEAM_ID: Apple Developer Team ID
      #   - APPLE_SIGNING_IDENTITY: e.g., "Developer ID Application: Your Name (TEAMID)"
      # ==========================================================================
      - name: Sign macOS Binary
        if: startsWith(matrix.os, 'macos') && env.SIGNING_CERT_AVAILABLE == 'true'
        env:
          SIGNING_CERT_AVAILABLE: ${{ secrets.APPLE_SIGNING_CERT_BASE64 != '' }}
        run: |
          echo "Signing macOS binary with Apple Developer certificate..."

          # Decode certificate from base64
          echo "${{ secrets.APPLE_SIGNING_CERT_BASE64 }}" | base64 --decode > cert.p12

          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          # Sign the binary with hardened runtime
          /usr/bin/codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            --verbose \
            artifacts/${{ matrix.asset_name }}

          # Verify signature
          /usr/bin/codesign --verify --verbose artifacts/${{ matrix.asset_name }}

          # Clean up
          rm -f cert.p12
          security delete-keychain "$KEYCHAIN_PATH"
          echo "Binary signed successfully!"

      - name: Skip macOS Signing (No Certificate)
        if: startsWith(matrix.os, 'macos') && env.SIGNING_CERT_AVAILABLE != 'true'
        env:
          SIGNING_CERT_AVAILABLE: ${{ secrets.APPLE_SIGNING_CERT_BASE64 != '' }}
        run: |
          echo "NOTE: macOS code signing skipped - APPLE_SIGNING_CERT_BASE64 secret not configured."
          echo "To enable signing, add the following secrets:"
          echo "  - APPLE_SIGNING_CERT_BASE64: Base64 encoded .p12 certificate"
          echo "  - APPLE_SIGNING_CERT_PASSWORD: Certificate password"
          echo "  - APPLE_SIGNING_IDENTITY: e.g., 'Developer ID Application: Your Name (TEAMID)'"

      - name: Upload Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.target }}
          path: artifacts/${{ matrix.asset_name }}
          retention-days: 7

  # ==========================================================================
  # Build Hub - Tauri desktop application
  # ==========================================================================
  build-hub:
    name: Build Hub (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_suffix: windows-x86_64

          - os: ubuntu-latest
            asset_suffix: linux-x86_64

          - os: macos-latest
            asset_suffix: macos-universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Linux dependencies for Tauri
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-hub-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      # ==========================================================================
      # CODE SIGNING (Windows - Tauri)
      # TODO: Add your code signing certificate
      # ==========================================================================
      - name: Build Hub (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run tauri:build
        # Uncomment when code signing is configured:
        # env:
        #   TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ==========================================================================
      # CODE SIGNING (macOS - Tauri)
      # TODO: Add Apple Developer certificates for notarization
      # ==========================================================================
      - name: Build Hub (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run tauri:build -- --target universal-apple-darwin
        # Uncomment when code signing is configured:
        # env:
        #   APPLE_SIGNING_IDENTITY: "Developer ID Application: YOUR_NAME"
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Hub (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run tauri:build

      - name: Upload Hub Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: hub-${{ matrix.asset_suffix }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

      - name: Upload Hub Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: hub-${{ matrix.asset_suffix }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7

      - name: Upload Hub Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: hub-${{ matrix.asset_suffix }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7

  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  release:
    name: Create Release
    needs: [build-agent, build-hub]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -ls

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.exe" -o -name "optio-agent-*" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) -exec sha256sum {} \; > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Optio v${{ steps.version.outputs.VERSION }}
          draft: true
          prerelease: false
          body: |
            ## Optio v${{ steps.version.outputs.VERSION }}

            ### Downloads

            #### Agent Binaries
            | Platform | Architecture | File |
            |----------|--------------|------|
            | Windows | x86_64 | `optio-agent-windows-x86_64.exe` |
            | Linux | x86_64 | `optio-agent-linux-x86_64` |
            | Linux | aarch64 | `optio-agent-linux-aarch64` |
            | macOS | x86_64 | `optio-agent-macos-x86_64` |
            | macOS | aarch64 (Apple Silicon) | `optio-agent-macos-aarch64` |

            #### Hub Installers
            - **Windows**: MSI installer or NSIS setup
            - **macOS**: Universal DMG (Intel + Apple Silicon)
            - **Linux**: DEB package or AppImage

            ### Checksums
            See `SHA256SUMS.txt` for file integrity verification.

            ### Installation

            #### Agent
            1. Download the appropriate binary for your platform
            2. Run the installer or extract and execute manually
            3. Configure connection to your Hub instance

            #### Hub
            1. Download and run the installer for your platform
            2. Complete the initial setup wizard

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/v0.0.0...v${{ steps.version.outputs.VERSION }}
          files: |
            artifacts/**/*
            SHA256SUMS.txt

      - name: Upload Release Artifacts Summary
        run: |
          echo "## Release v${{ steps.version.outputs.VERSION }} created successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find artifacts -type f -name "*.exe" -o -name "optio-agent-*" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" | while read f; do
            echo "$(basename $f)"
          done >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
