[package]
name = "optio-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "optio_core"
path = "src/lib.rs"

[dependencies]
prost = { workspace = true }
serde = { workspace = true }
tonic = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
ipnetwork = "0.20"
rusqlite = { version = "0.34", features = ["bundled"] }
tokio = { workspace = true }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tonic-build = "0.10"
