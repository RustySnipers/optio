syntax = "proto3";

package optio;

service Collector {
  rpc SubmitScanResult(ScanResult) returns (SubmitScanResultResponse);
}

message ScanResult {
  string machine_id = 1;
  string scan_id = 2;
  string target = 3;
  uint64 started_at = 4;
  uint64 finished_at = 5;
  string status = 6;
  string payload_json = 7;
}

message SubmitScanResultResponse {
  bool accepted = 1;
  string message = 2;
}
