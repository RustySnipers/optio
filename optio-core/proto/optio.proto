syntax = "proto3";

package optio;

// Collector service receives scan results and heartbeats from agents
service Collector {
  // Submit network scan results from agent
  rpc SubmitScanResult(ScanResult) returns (SubmitScanResultResponse);

  // Agent heartbeat - reports health and receives pending commands
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// Command service allows the hub to execute commands on agents
service CommandService {
  // Execute a script on the agent
  rpc ExecuteScript(ExecuteScriptRequest) returns (ExecuteScriptResponse);
}

// Terminal service for interactive remote shell sessions
service TerminalService {
  // Start an interactive terminal session with bidirectional streaming
  // Input: stream of keyboard input and control signals
  // Output: stream of terminal output (stdout/stderr)
  rpc StartTerminal(stream TerminalInput) returns (stream TerminalOutput);
}

// Update service for agent self-update (Phoenix module)
service UpdateService {
  // Check for available updates
  // Returns the latest version info and SHA256 hash
  rpc CheckVersion(CheckVersionRequest) returns (CheckVersionResponse);

  // Download the latest agent binary
  // Returns the binary as a stream of chunks for large file support
  rpc GetAgentBinary(GetAgentBinaryRequest) returns (stream BinaryChunk);
}

// ============================================================================
// Terminal Session Messages
// ============================================================================

message TerminalInput {
  // Unique session ID for this terminal connection
  string session_id = 1;

  // Machine ID of the target agent
  string machine_id = 2;

  // Input type discriminator
  oneof input {
    // Start a new terminal session
    TerminalStartRequest start = 3;
    // Send keyboard input to the terminal
    TerminalData data = 4;
    // Resize the terminal window
    TerminalResize resize = 5;
    // Signal to the terminal (e.g., SIGINT)
    TerminalSignal signal = 6;
    // Close the terminal session
    TerminalClose close = 7;
  }
}

message TerminalStartRequest {
  // Shell type: "powershell", "cmd", "bash", "sh"
  string shell_type = 1;

  // Initial terminal dimensions
  uint32 cols = 2;
  uint32 rows = 3;

  // Working directory (optional)
  string working_directory = 4;

  // Environment variables (JSON object)
  string environment_json = 5;
}

message TerminalData {
  // Raw input bytes (keyboard input)
  bytes data = 1;
}

message TerminalResize {
  // New terminal dimensions
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalSignal {
  // Signal name: "SIGINT", "SIGTERM", "SIGKILL", etc.
  string signal = 1;
}

message TerminalClose {
  // Reason for closing (optional)
  string reason = 1;
}

message TerminalOutput {
  // Session ID this output belongs to
  string session_id = 1;

  // Output type discriminator
  oneof output {
    // Terminal session started successfully
    TerminalStarted started = 2;
    // Terminal output data
    TerminalOutputData data = 3;
    // Terminal session ended
    TerminalEnded ended = 4;
    // Error occurred
    TerminalError error = 5;
  }
}

message TerminalStarted {
  // Actual shell type that was started
  string shell_type = 1;
  // Process ID of the shell
  uint32 pid = 2;
}

message TerminalOutputData {
  // Raw output bytes from the terminal
  bytes data = 1;
}

message TerminalEnded {
  // Exit code of the shell process
  int32 exit_code = 1;
  // Reason for termination
  string reason = 2;
}

message TerminalError {
  // Error code
  string code = 1;
  // Error message
  string message = 2;
}

// ============================================================================
// Scan Result Messages
// ============================================================================

message ScanResult {
  string machine_id = 1;
  string scan_id = 2;
  string target = 3;
  uint64 started_at = 4;
  uint64 finished_at = 5;
  string status = 6;
  string payload_json = 7;
}

message SubmitScanResultResponse {
  bool accepted = 1;
  string message = 2;
}

// ============================================================================
// Heartbeat Messages
// ============================================================================

message HeartbeatRequest {
  // Unique hardware-derived identifier for the agent machine
  string machine_id = 1;

  // Agent version string
  string agent_version = 2;

  // Hostname of the agent machine
  string hostname = 3;

  // Operating system info
  string os_info = 4;

  // Current CPU usage percentage (0-100)
  float cpu_usage = 5;

  // Current RAM usage percentage (0-100)
  float ram_usage = 6;

  // Total RAM in bytes
  uint64 ram_total = 7;

  // Available disk space in bytes
  uint64 disk_free = 8;

  // Total disk space in bytes
  uint64 disk_total = 9;

  // Agent uptime in seconds
  uint64 uptime_seconds = 10;

  // IP addresses of the agent (comma-separated for multiple)
  string ip_addresses = 11;

  // Unix timestamp of when this heartbeat was generated
  uint64 timestamp = 12;
}

message HeartbeatResponse {
  // Whether the heartbeat was accepted
  bool accepted = 1;

  // Message from the hub
  string message = 2;

  // Recommended interval until next heartbeat (seconds)
  uint32 next_heartbeat_seconds = 3;

  // Pending commands for the agent to execute
  repeated PendingCommand pending_commands = 4;
}

message PendingCommand {
  // Unique command ID
  string command_id = 1;

  // Command type (e.g., "execute_script", "update_config")
  string command_type = 2;

  // Command payload (JSON-encoded for flexibility)
  string payload_json = 3;

  // Priority (higher = more urgent)
  uint32 priority = 4;

  // Timeout for command execution in seconds
  uint32 timeout_seconds = 5;
}

// ============================================================================
// Script Execution Messages
// ============================================================================

message ExecuteScriptRequest {
  // Unique command ID for tracking
  string command_id = 1;

  // Machine ID of the target agent
  string machine_id = 2;

  // Script type: "powershell", "bash", "cmd"
  string script_type = 3;

  // Script content (raw or base64-encoded)
  string script_content = 4;

  // Whether script_content is base64 encoded
  bool is_encoded = 5;

  // Execution timeout in seconds
  uint32 timeout_seconds = 6;

  // Working directory for script execution
  string working_directory = 7;

  // Environment variables (JSON object)
  string environment_json = 8;

  // Whether to run with elevated privileges
  bool run_elevated = 9;
}

message ExecuteScriptResponse {
  // Command ID from the request
  string command_id = 1;

  // Machine ID of the executing agent
  string machine_id = 2;

  // Whether execution was successful
  bool success = 3;

  // Exit code from the script
  int32 exit_code = 4;

  // Standard output from the script
  string stdout = 5;

  // Standard error from the script
  string stderr = 6;

  // Error message if execution failed
  string error_message = 7;

  // Execution start timestamp (unix)
  uint64 started_at = 8;

  // Execution end timestamp (unix)
  uint64 finished_at = 9;

  // Duration in milliseconds
  uint64 duration_ms = 10;
}

// ============================================================================
// Command Result Messages (for async command reporting)
// ============================================================================

message CommandResult {
  // Original command ID
  string command_id = 1;

  // Machine ID that executed the command
  string machine_id = 2;

  // Command type that was executed
  string command_type = 3;

  // Whether the command succeeded
  bool success = 4;

  // Result payload (JSON-encoded)
  string result_json = 5;

  // Error message if failed
  string error_message = 6;

  // Execution timestamps
  uint64 started_at = 7;
  uint64 finished_at = 8;
}

// ============================================================================
// Update Service Messages (Phoenix Module)
// ============================================================================

message CheckVersionRequest {
  // Current agent version (semver format)
  string current_version = 1;

  // Machine ID for tracking
  string machine_id = 2;

  // Target platform (e.g., "windows", "linux", "macos")
  string platform = 3;

  // Target architecture (e.g., "x86_64", "aarch64")
  string architecture = 4;
}

message CheckVersionResponse {
  // Whether an update is available
  bool update_available = 1;

  // Latest available version (semver format)
  string latest_version = 2;

  // SHA256 hash of the latest binary (hex-encoded)
  string sha256 = 3;

  // Size of the binary in bytes
  uint64 size_bytes = 4;

  // Optional release notes (markdown)
  string release_notes = 5;

  // Whether this is a mandatory/critical update
  bool mandatory = 6;

  // Minimum version required to update (for breaking changes)
  string minimum_version = 7;
}

message GetAgentBinaryRequest {
  // Target version to download (empty for latest)
  string version = 1;

  // Machine ID for tracking/auditing
  string machine_id = 2;

  // Target platform
  string platform = 3;

  // Target architecture
  string architecture = 4;
}

message BinaryChunk {
  // Chunk sequence number (0-indexed)
  uint32 chunk_number = 1;

  // Total number of chunks
  uint32 total_chunks = 2;

  // Binary data for this chunk
  bytes data = 3;

  // SHA256 hash of this chunk (for incremental verification)
  string chunk_hash = 4;

  // Total file size in bytes
  uint64 total_size = 5;
}
